# Builds the three Docker images on GitHub (not on the small server) and publishes
# them to GitHub Container Registry. The server only pulls ready images.
name: Images
on:
  push:
    branches: [main]
  pull_request:       # build only, to catch Dockerfile errors
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: services/api, file: services/api/Dockerfile }
          - { name: bot, context: services/telegram-bot, file: services/telegram-bot/Dockerfile }
          - { name: web, context: ., file: infrastructure/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.repo }}-${{ matrix.name }}:latest
            ${{ steps.meta.outputs.repo }}-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
